name: Release Chrome Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare extension files
        run: |
          mkdir -p dist release
          cp -r manifest.json background.js content.js fonts.js popup.html popup.css popup.js fonts icons _locales dist/

      - name: Build ZIP archive (for Chrome Web Store / Load Unpacked)
        run: |
          TAG="${GITHUB_REF_NAME}"
          (cd dist && zip -r "../release/emoji-win-flags-${TAG}.zip" .)

      - name: Build CRX3 package
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            printf '%s\n' "$CRX_PRIVATE_KEY" > key.pem
          fi
          npx --yes crx3 dist -p key.pem -o "release/emoji-win-flags-${TAG}.crx"
          rm -f key.pem

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.crx
            release/*.zip
